# tmux config for the private ads server (`tmux -L ads -f <this file>`). Plan §4.2.

# Own prefix so an outer tmux (default C-b) keeps working when ads runs nested.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Shift+Enter: needs extended keys (the outer terminal/tmux must send them too).
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

set -g allow-passthrough on
set -g remain-on-exit on
set -g history-limit 50000
set -g mouse on
set -g pane-border-status top
set -g pane-border-format ' #{@ads_role} [#{@ads_state}] '

# In the human editor pane Shift+Enter becomes C-j (newline); elsewhere pass it through.
bind-key -n S-Enter if-shell -F '#{==:#{@ads_role},human}' 'send-keys C-j' 'send-keys S-Enter'
