[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ads"
version = "0.1.0"
description = "Audiso Development System: tmux-based multi-agent Claude Code environment"
requires-python = ">=3.14"
dependencies = ["prompt_toolkit>=3.0.53"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ads = "ads.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ads = ["prompts/*.md", "tmux/*.conf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["tmux: needs a tmux server"]
